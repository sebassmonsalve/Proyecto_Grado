<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parqueadero CUL - Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="encabezado">
    <h1>Parqueadero CUL</h1>
    <a href="index.html" style="color:white; font-size:0.85rem;">Volver a la pantalla pública</a>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Iniciar sesión</h2>
      <form id="formLogin" class="formulario">
        <div>
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required />
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Ingresar</button>
      </form>
      <div id="mensajeLogin"></div>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
